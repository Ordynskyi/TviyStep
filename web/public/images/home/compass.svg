<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="#ffffff">
  <!-- Central Ring -->
  <circle cx="200" cy="200" r="50" stroke="#ffffff" stroke-width="6" fill="none" opacity="0.6" />
  <circle cx="200" cy="200" r="14" fill="#ffffff" />

  <!-- North Point (Tapered Star Ray) -->
  <polygon points="200,30 209,180 191,180" fill="#ffffff" />
  <!-- South Point -->
  <polygon points="200,370 209,220 191,220" fill="#ffffff" />
  <!-- East Point -->
  <polygon points="370,200 220,209 220,191" fill="#ffffff" />
  <!-- West Point -->
  <polygon points="30,200 180,209 180,191" fill="#ffffff" />

  <!-- NE Diagonal Point -->
  <polygon points="310,90 209,191 216,204" fill="#ffffff" opacity="0.8" />
  <!-- SE Diagonal Point -->
  <polygon points="310,310 216,196 209,209" fill="#ffffff" opacity="0.8" />
  <!-- SW Diagonal Point -->
  <polygon points="90,310 191,209 184,196" fill="#ffffff" opacity="0.8" />
  <!-- NW Diagonal Point -->
  <polygon points="90,90 184,204 191,191" fill="#ffffff" opacity="0.8" />
</svg>
